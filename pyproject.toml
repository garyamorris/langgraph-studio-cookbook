[project]
name = "langgraph-deepdive"
version = "0.1.0"
description = "A playground of ~20 problem-driven LangGraph examples for exploring architecture patterns in LangGraph Studio."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-cli[inmem]>=0.4",
    "langchain-core>=1.7",
    "langchain-openai>=1.7",
    "openai>=3.46",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepdive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
